# Checks on every push and pull request. Nothing here deploys.
name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the HTML validator (needs Java, which the runner has)
        run: pip install html5validator==0.4.2
      - name: Generated blocks are up to date
        run: |
          python3 scripts/build_repos.py --check
          python3 scripts/build_media.py --check
      - name: Numbers
        run: python3 scripts/check_numbers.py
      - name: TODO blocks (listed; they fail only the deploy)
        run: python3 scripts/check_todos.py
      - name: Links (private-repo 404s are expected until the repos are public)
        run: python3 scripts/check_links.py
      - name: Repo visibility (reported; strict only in the deploy)
        run: python3 scripts/check_public.py --allow-private
      - name: HTML5 validation
        run: html5validator --root public --log INFO
